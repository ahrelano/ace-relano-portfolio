      <circle cx="199" cy="531" r="13" fill="#1557ff"/>
      <text x="225" y="528" fill="white" font-size="14" font-weight="700">Customer rule</text>
      <text x="225" y="548" fill="#c8c7c2" font-size="12">Priority 10</text>
      <path d="M290 570v26" stroke="#9c9991" stroke-width="2"/>
      <path d="m283 590 7 7 7-7" fill="none" stroke="#9c9991" stroke-width="2"/>
      <rect x="171" y="604" width="238" height="62" rx="14" fill="#fff" stroke="#d4d2cb"/>
      <circle cx="199" cy="635" r="13" fill="#dce5ff"/>
      <text x="225" y="632" fill="#171717" font-size="14" font-weight="700">Quantity break</text>
      <text x="225" y="652" fill="#77736b" font-size="12">Threshold evaluated</text>
      <path d="M290 674v26" stroke="#9c9991" stroke-width="2"/>
      <path d="m283 694 7 7 7-7" fill="none" stroke="#9c9991" stroke-width="2"/>
      <rect x="171" y="708" width="238" height="54" rx="14" fill="#fff" stroke="#d4d2cb"/>
      <circle cx="199" cy="735" r="13" fill="#e8e6df"/>
      <text x="225" y="740" fill="#171717" font-size="14" font-weight="700">Base price</text>
    </g>
  </g>

  <path d="M465 590h70" stroke="#1557ff" stroke-width="3"/>
  <path d="m525 581 10 9-10 9" fill="none" stroke="#1557ff" stroke-width="3"/>

