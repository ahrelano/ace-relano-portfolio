<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Odoo commerce and ERP system map</title>
  <desc id="desc">Fictional interface showing pricing rules flowing through a configurable product, cart validation, and ERP sales order.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#101114" flood-opacity=".14"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0v56" fill="none" stroke="#d9d7d0" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="#eeece6"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity=".55"/>
  <circle cx="1370" cy="110" r="280" fill="#1557ff" opacity=".08"/>
  <text x="90" y="92" fill="#1557ff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">CONCEPTUAL SYSTEM MAP • FICTIONAL DATA</text>
  <text x="90" y="150" fill="#171717" font-family="Georgia, serif" font-size="48" font-weight="700">One rule path, four system moments.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="220" width="1420" height="680" rx="32" fill="#fbfaf7" stroke="#d4d2cb"/>
    <rect x="90" y="220" width="1420" height="82" rx="32" fill="#171717"/>
    <path d="M90 270h1420v32H90z" fill="#171717"/>
    <circle cx="138" cy="261" r="7" fill="#f3f0e9" opacity=".35"/>
    <circle cx="164" cy="261" r="7" fill="#f3f0e9" opacity=".35"/>
    <circle cx="190" cy="261" r="7" fill="#f3f0e9" opacity=".35"/>
    <text x="235" y="270" fill="#f3f0e9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Commerce rule workspace</text>
    <rect x="1290" y="242" width="174" height="38" rx="19" fill="#1557ff"/>
    <text x="1377" y="267" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">VALIDATION VIEW</text>
  </g>

  <g>
    <text x="142" y="357" fill="#77736b" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 / PRICING</text>
