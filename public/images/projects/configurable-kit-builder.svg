    <rect x="498" y="637" width="188" height="116" rx="17" fill="#fff" stroke="#1557ff" stroke-width="2"/>
    <rect x="517" y="657" width="24" height="24" rx="7" fill="#1557ff"/>
    <path d="m523 669 5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/>
    <text x="517" y="714" fill="#171717" font-size="14" font-weight="700">Storage tray</text>
    <text x="517" y="735" fill="#77736b" font-size="12">+$18</text>
    <rect x="702" y="637" width="188" height="116" rx="17" fill="#fff" stroke="#1557ff" stroke-width="2"/>
    <rect x="721" y="657" width="24" height="24" rx="7" fill="#1557ff"/>
    <path d="m727 669 5 5 9-11" fill="none" stroke="white" stroke-width="2.5"/>
    <text x="721" y="714" fill="#171717" font-size="14" font-weight="700">Safety set</text>
    <text x="721" y="735" fill="#77736b" font-size="12">+$12</text>
    <rect x="906" y="637" width="188" height="116" rx="17" fill="#fff" stroke="#d6d3cb"/>
    <rect x="925" y="657" width="24" height="24" rx="7" fill="#fff" stroke="#bdbab1"/>
