<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual configurable kit builder</title>
  <desc id="desc">Fictional product configurator showing required and optional components, pricing mode, inventory validation, and cart readiness.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="32" flood-color="#121318" flood-opacity=".16"/></filter>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1557ff"/><stop offset="1" stop-color="#1942b8"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#e8e7e2"/>
  <path d="M0 0h520L190 1000H0z" fill="#1557ff" opacity=".06"/>
  <text x="86" y="88" fill="#1557ff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">CONCEPTUAL PRODUCT UI • FICTIONAL DATA</text>
  <text x="86" y="148" fill="#171717" font-family="Georgia, serif" font-size="48" font-weight="700">Configure once. Validate at every boundary.</text>

  <g filter="url(#shadow)">
    <rect x="86" y="210" width="1428" height="700" rx="34" fill="#fbfaf7" stroke="#d1cfc8"/>
