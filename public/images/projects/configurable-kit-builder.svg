    <text x="498" y="383" fill="#77736b" font-size="14">Generic products and values for demonstration only.</text>

    <text x="498" y="438" fill="#77736b" font-size="12" font-weight="700" letter-spacing="1.6">REQUIRED SUBSTITUTION</text>
    <rect x="498" y="459" width="288" height="96" rx="17" fill="#dfe7ff" stroke="#1557ff" stroke-width="2"/>
    <circle cx="532" cy="507" r="13" fill="#1557ff"/>
    <path d="m526 507 5 5 8-10" fill="none" stroke="white" stroke-width="2.5"/>
