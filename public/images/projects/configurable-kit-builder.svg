    <text x="186" y="551" text-anchor="middle" fill="#1557ff" font-size="18" font-weight="700">2</text>
    <text x="230" y="538" fill="#171717" font-size="16" font-weight="700">Substitutions</text>
    <text x="230" y="560" fill="#77736b" font-size="13">Required choices</text>
    <path d="M186 573v60" stroke="#cbc8bf" stroke-width="2" stroke-dasharray="5 6"/>
    <circle cx="186" cy="661" r="28" fill="#fff" stroke="#d1cec6"/>
    <text x="186" y="668" text-anchor="middle" fill="#77736b" font-size="18" font-weight="700">3</text>
    <text x="230" y="655" fill="#171717" font-size="16" font-weight="700">Optional add-ons</text>
    <text x="230" y="677" fill="#77736b" font-size="13">2 of 4 selected</text>
    <rect x="154" y="735" width="266" height="106" rx="17" fill="#171717"/>
