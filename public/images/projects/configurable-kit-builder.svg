    <text x="154" y="367" fill="#77736b" font-size="13" font-weight="700" letter-spacing="2">YOUR CONFIGURATION</text>
    <circle cx="186" cy="427" r="28" fill="url(#blue)"/>
    <path d="m174 427 8 8 16-18" fill="none" stroke="white" stroke-width="4"/>
    <text x="230" y="421" fill="#171717" font-size="16" font-weight="700">Base assembly</text>
    <text x="230" y="443" fill="#77736b" font-size="13">Required • selected</text>
    <path d="M186 456v60" stroke="#cbc8bf" stroke-width="2" stroke-dasharray="5 6"/>
