    <rect x="1170" y="442" width="274" height="48" rx="24" fill="#fff" stroke="#d6d3cb"/>
    <rect x="1176" y="448" width="130" height="36" rx="18" fill="#171717"/>
    <text x="1241" y="471" text-anchor="middle" fill="white" font-size="11" font-weight="700">COMPONENT SUM</text>
    <text x="1373" y="471" text-anchor="middle" fill="#77736b" font-size="11" font-weight="700">FIXED KIT</text>
    <line x1="1170" y1="530" x2="1444" y2="530" stroke="#d5d2ca"/>
    <text x="1170" y="572" fill="#171717" font-size="14" font-weight="700">Inventory</text>
    <rect x="1170" y="592" width="274" height="68" rx="14" fill="#e7f4eb"/>
    <circle cx="1202" cy="626" r="16" fill="#217a42"/>
    <path d="m1195 626 5 5 10-12" fill="none" stroke="white" stroke-width="3"/>
    <text x="1232" y="623" fill="#17582f" font-size="13" font-weight="700">All components ready</text>
    <text x="1232" y="642" fill="#39724d" font-size="11">Recheck before order</text>
    <text x="1170" y="708" fill="#171717" font-size="14" font-weight="700">Configuration state</text>
    <rect x="1170" y="728" width="274" height="54" rx="14" fill="#fff" stroke="#d6d3cb"/>
    <text x="1190" y="760" fill="#171717" font-size="12" font-weight="700">Valid payload</text>
    <text x="1422" y="760" text-anchor="end" fill="#1557ff" font-size="12" font-weight="700">READY</text>
    <rect x="1170" y="804" width="274" height="44" rx="22" fill="url(#blue)"/>
    <text x="1307" y="831" text-anchor="middle" fill="white" font-size="13" font-weight="700">ADD CONFIGURATION TO CART</text>
  </g>

  <text x="86" y="958" fill="#77736b" font-family="Arial, sans-serif" font-size="15">Privacy-safe placeholder • Replace via src/data/portfolio.ts • No client products shown</text>
</svg>
